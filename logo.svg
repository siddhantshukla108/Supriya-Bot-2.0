<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d94" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff4d94" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Beautiful Heart -->
  <path d="M 50,30 C 35,10 10,15 10,40 C 10,65 50,90 50,90 C 50,90 90,65 90,40 C 90,15 65,10 50,30 Z" fill="url(#pinkGrad)" filter="url(#glow)" />
  <!-- Crack representing the broken heart 💔 -->
  <path d="M 50,30 L 45,45 L 55,55 L 43,68 L 50,90" stroke="#151522" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
