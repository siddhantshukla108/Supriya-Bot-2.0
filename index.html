<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Supriya Bot💔</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2LF2KEMHGR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-2LF2KEMHGR');
</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating hearts background -->
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="profile-pic">
                    <img src="https://ui-avatars.com/api/?name=Supriya&background=ff4d94&color=fff&rounded=true&bold=true" alt="Supriya">
                    <span class="status-dot"></span>
                </div>
                <div class="header-content">
                    <h1>Supriya Bot 💔<span class="heart-pulse">❤️</span></h1>
                    <div class="status">Online...</div>
                </div>
            </div>
            <div class="header-actions">
                <i class="fas fa-video"></i>
                <i class="fas fa-phone"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>
        
        <div class="welcome-banner">
            <i class="fas fa-heart"></i> Chat with Supriya Bot - Share your thoughts <i class="fas fa-heart"></i>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- <div class="message bot">
                <span class="bot-message-decoration left">❣️</span>
                <span class="message-text">Hey Babu! 😊 Kaise ho? Kya soch rahe ho? 💭</span>
                <span class="bot-message-decoration right">💖</span>
                <span class="message-time">Just now</span>
            </div> -->
        </div>
        
        <div class="chat-input-area">
            <div class="input-wrapper">
                <button class="icon-btn emoji-btn"><i class="fas fa-smile"></i></button>
                <input type="text" id="userInput" placeholder="Message Supriya...">
                <button class="icon-btn attachment-btn"><i class="fas fa-paperclip"></i></button>
                <button id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
